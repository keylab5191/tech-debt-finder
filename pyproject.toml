[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "tech-debt-finder"
version = "0.1.0"
description = "AI-powered tech debt scanner that reviews codebases using local LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "rich>=13.0",
    "pathspec>=0.12",
]

[project.scripts]
tech-debt-finder = "tech_debt_finder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
